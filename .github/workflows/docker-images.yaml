name: Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install orchestrator test dependencies
        run: python -m pip install -r orchestrator/requirements.txt

      - name: Test orchestrator contracts
        run: PYTHONPATH=orchestrator python -m unittest discover -s orchestrator/tests -v

      - name: Test runner contracts
        run: python -m unittest discover -s runner_wrapper/tests -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestrator
            image: scenegendeploybench-orchestrator
            context: ./orchestrator
            dockerfile: ./orchestrator/Dockerfile
          - name: test runner
            image: scenegendeploybench-testrunner
            context: ./runner_wrapper
            dockerfile: ./runner_wrapper/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set lowercase image namespace
        id: namespace
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
